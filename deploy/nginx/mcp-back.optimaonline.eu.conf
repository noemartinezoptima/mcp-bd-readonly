# Proxy público para el MCP. uvicorn escucha SOLO en 127.0.0.1:8443.
#
# TLS: el certificado de origen de Cloudflare que ya usa la plataforma
# (*.optimaonline.eu, Origin CA). No hay que emitir nada: Cloudflare proxy
# delante => "Full (strict)".
#
# Riesgo para el resto del servidor: ninguno de configuración. Este vhost solo
# añade un server_name propio; no es default_server (lo es 000-catch-all) y no
# toca el site de la plataforma. Si `nginx -t` falla, no se recarga nada.
#
# Si en lugar de exponer 443 usas cloudflared (túnel saliente), borra la sección
# `listen 443` y deja solo el bloque `location` dentro del vhost que crea
# cloudflared: no hace falta abrir ningún puerto ni allowlist de IPs.

# IPs de Cloudflare. Genera el fichero con:
#   curl -s https://www.cloudflare.com/ips-v4 >  /etc/nginx/snippets/cloudflare-ips.conf
#   curl -s https://www.cloudflare.com/ips-v6 >> /etc/nginx/snippets/cloudflare-ips.conf
# y convierte cada línea en `allow <cidr>;` (o usa el módulo real_ip + geo).

server {
    listen 80;
    server_name mcp-back.optimaonline.eu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name mcp-back.optimaonline.eu;

    # Mismo certificado wildcard que ya sirve back.optimaonline.eu.
    ssl_certificate     /etc/nginx/ssl/back.optimaonline.eu/3521089/server.crt;
    ssl_certificate_key /etc/nginx/ssl/back.optimaonline.eu/3521089/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Solo Cloudflare puede llegar al origen. 127.0.0.1 queda permitido para
    # poder verificar con curl --resolve antes de que exista el DNS.
    allow 127.0.0.1;
    allow ::1;
    include /etc/nginx/snippets/cloudflare-ips.conf;
    deny all;

    # Mismo límite que max_request_body_size del servidor MCP (4 MiB).
    client_max_body_size 4m;

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy no-referrer always;

    access_log /var/log/nginx/mcp-back.access.log;
    error_log  /var/log/nginx/mcp-back.error.log;

    location = /healthz {
        proxy_pass http://127.0.0.1:8443;
        proxy_set_header Host $host;
        access_log off;
    }

    location /mcp {
        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;

        # Sin buffering: MCP responde según la petición y bufferizar rompe
        # clientes que esperan la respuesta en el mismo stream.
        proxy_buffering off;
        proxy_request_buffering off;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    location / {
        return 404;
    }
}
